[package]
name = "horizon-compat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runtime for NeoForge mods translated to native Rust: values, objects, the Minecraft API mapped onto Horizon"

[dependencies]
horizon-compat-core = { path = "../horizon-compat-core" }
# Recipe files and the codecs that read them (the bundle's engine names it too: it is in Horizon's lock).
serde_json = "1.0.151"
# The textures mods read (`NativeImage.read`); Horizon's own decoder, in its lock too.
png = "0.18"
# `java.util.regex` (`jregex`): the engine Horizon's OptiFine reader uses, with its features.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# And for the patterns only a backtracking engine reads (lookahead and lookbehind, which mods
# split camelCase names and config comments by): the same syntax over the same automata.
fancy-regex = { version = "0.20", default-features = false, features = ["std", "unicode"] }
# `java.lang.Math` as HotSpot rounds it (`jmath`): the fdlibm ports horizon-core uses, at its pin.
libm = "=0.2.16"
# NBT files and Java's gzip and zlib streams (`NbtIo.readCompressed`, `GZIPInputStream`): the
# deflate Horizon's own saves use, with its features.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }

[lints]
workspace = true
