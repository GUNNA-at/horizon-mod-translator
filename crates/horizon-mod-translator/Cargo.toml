[package]
name = "horizon-mod-translator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ahead-of-time translator from NeoForge mod bytecode to native Rust Horizon mods"

[dependencies]
horizon-compat = { path = "../horizon-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
# The content manifests it writes, read back as the game reads them.
horizon-mods = { path = "../horizon-mods" }
