<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" aria-labelledby="t d"><title id="t">Horizon</title><desc id="d">No JVM at any step: what runs in the game is Rust.</desc><!-- Made by tools/translator_progress.py from docs/translator/progress.json. Type: subsets of Geist and Geist Mono (Copyright 2024 The Geist Project Authors) and Bricolage Grotesque (Copyright 2022 The Bricolage Grotesque Project Authors), under the SIL Open Font License 1.1: crates/horizon-theme/fonts/OFL-Geist.txt, OFL-BricolageGrotesque.txt. --><line x1="18" y1="92" x2="879" y2="92" stroke="#5333c9" stroke-width="2"/><rect x="18" y="86" width="12" height="12" fill="#5333c9"/><text x="18.0" y="70.0" font-family="'HZ Geist Medium', sans-serif" font-weight="500" font-size="19" fill="#1b1530">Read</text><text x="18.0" y="130.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">A mod's classes and</text><text x="18.0" y="151.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">bytecode, with the</text><text x="18.0" y="172.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">jars it bundles</text><text x="18.0" y="203.0" font-family="'HZ Geist Mono', ui-monospace, monospace" font-weight="400" font-size="12" fill="#585071">class.rs · insn.rs</text><rect x="186" y="86" width="12" height="12" fill="#5333c9"/><text x="186.0" y="70.0" font-family="'HZ Geist Medium', sans-serif" font-weight="500" font-size="19" fill="#1b1530">Weave</text><text x="186.0" y="130.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">Mixins join their</text><text x="186.0" y="151.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">targets: other mods'</text><text x="186.0" y="172.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">classes and the game's</text><text x="186.0" y="203.0" font-family="'HZ Geist Mono', ui-monospace, monospace" font-weight="400" font-size="12" fill="#585071">weave.rs</text><rect x="354" y="86" width="12" height="12" fill="#5333c9"/><text x="354.0" y="70.0" font-family="'HZ Geist Medium', sans-serif" font-weight="500" font-size="19" fill="#1b1530">Translate</text><text x="354.0" y="130.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">Every opcode to Rust:</text><text x="354.0" y="151.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">lambdas, exceptions,</text><text x="354.0" y="172.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">records, switches</text><text x="354.0" y="203.0" font-family="'HZ Geist Mono', ui-monospace, monospace" font-weight="400" font-size="12" fill="#585071">codegen.rs</text><rect x="522" y="86" width="12" height="12" fill="#5333c9"/><text x="522.0" y="70.0" font-family="'HZ Geist Medium', sans-serif" font-weight="500" font-size="19" fill="#1b1530">Answer</text><text x="522.0" y="130.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">Game, NeoForge and</text><text x="522.0" y="151.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">Java library calls,</text><text x="522.0" y="172.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">answered natively</text><text x="522.0" y="203.0" font-family="'HZ Geist Mono', ui-monospace, monospace" font-weight="400" font-size="12" fill="#585071">horizon-compat</text><rect x="690" y="86" width="12" height="12" fill="#5333c9"/><text x="690.0" y="70.0" font-family="'HZ Geist Medium', sans-serif" font-weight="500" font-size="19" fill="#1b1530">Build</text><text x="690.0" y="130.0" font-family="'HZ Geist', sans-serif" font-weight="400" font-size="14" fill="#3b3354">Bundled into Horizon's</text><text x="690.0" y="151.0" font-family="'